name: Build & Test

on:
  push:
    branches-ignore:
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: | 
            8.0.x
            9.0.x
            10.0.x

      - name: Install SQL Server
        uses: Particular/install-sql-server-action@v1.4.0
        with:
          connection-string-env-var: TEST_CONNECTION_STRING
          catalog: RapidLaunch
          extra-params: "TrustServerCertificate=true;"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.12.1

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -v normal -c Release /p:CollectCoverage=true /p:Threshold=10 /p:ThresholdType=branch